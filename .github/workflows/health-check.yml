name: health-check

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行自检
        id: hc
        run: |
          set +e
          python3 tools/health_check.py --write
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: 重建问答编年史
        run: python3 tools/build_qa_log.py

      - name: 提交健康报告与编年史
        run: |
          git config user.name "health-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add health_report.md
          git add data/*/*/qa_log.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "bot: health check + qa logs $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: 简报缺失则告警(工作流失败触发邮件)
        if: steps.hc.outputs.exit_code != '0'
        run: |
          echo "::error::今日简报缺失,invest-data-agent 可能未运行 — 详见 health_report.md"
          exit 1
