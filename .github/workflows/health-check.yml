name: health-check

on:
  schedule:
    - cron: "40 0 * * *"   # 每天 00:40 UTC,即北京时间 08:40,Agent 跑完约 35 分钟后
  workflow_dispatch: {}     # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行自检
        id: hc
        run: |
          set +e
          python3 tools/health_check.py --write
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: 提交健康报告
        run: |
          git config user.name "health-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add health_report.md
          git diff --cached --quiet || git commit -m "health check $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: 简报缺失则告警(工作流失败会触发邮件通知)
        if: steps.hc.outputs.exit_code != '0'
        run: |
          echo "::error::今日简报缺失,invest-data-agent 可能未运行 — 详见 health_report.md"
          exit 1
